<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSBasics</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      id="loading-screen"
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100px;
        font-family: monospace;
        font-size: 2rem;
      "
    >
      Loading resources. Please wait...
    </div>

    <!-- 
      Ого, прикольные комменты. Делаются на ctrl + /
      Короче, это полоска хп врага. Просто знай
      -->

    <div id="game-app" style="display: none">
      <h1>RPG Game (Hero level: <span id="game-level">1</span>)</h1>
      <h2>Current floor: <span id="dungeon-floor">1</span></h2>

      <div class="game-container">
        <div class="hero-panel">
          <div class="hero-stats">
            <h2>Hero HP: <span id="hero-hp">100</span></h2>
            <h3>Hero MP: <span id="hero-mp">50</span></h3>
            <h3>Weapons: <span id="hero-weapons">0/2</span></h3>
            <div id="equipped-weapons-list"></div>
            <h3>Gold: <span id="gold-balance">0</span></h3>
          </div>

          <div class="hp-bar-container">
            <div
              id="hero-hp-bar"
              style="
                width: 100%;
                height: 100%;
                background-color: red;
                transition: width 0.3s;
              "
            ></div>
          </div>

          <div class="hp-bar-container" style="height: 15px">
            <div id="hero-mp-bar" style="width: 100%"></div>
          </div>

          <hr style="border: 1px solid #4a0000; margin: 20px 0" />
          <h3>Shop:</h3>
          <ul id="shop-list"></ul>

          <hr style="border: 1px solid #4a0000; margin: 20px 0" />
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 10px;
            "
          >
            <h3 style="margin: 0">Inventory</h3>
            <button id="sell-mode-btn" style="margin: 0">Sell Mode: OFF</button>
          </div>
          <ul id="inventory-list"></ul>
        </div>

        <div class="arena-panel">
          <!-- display: none == панель скрыта от пользователя -->
          <div id="combat-panel" style="display: none">
            <img
              id="enemy-img"
              src=""
              alt="Enemy"
              style="
                width: 200px;
                height: 200px;
                object-fit: cover;
                border: 2px solid black;
              "
            />

            <h2>Enemy HP: <span id="enemy-hp">100</span></h2>
            <div class="hp-bar-container">
              <div
                id="enemy-hp-bar"
                style="
                  width: 100%;
                  height: 100%;
                  background-color: limegreen;
                  transition: width 0.3s;
                "
              ></div>
            </div>

            <button id="attack-btn">ATTACK!</button>
          </div>

          <div id="mini-map"></div>

          <button id="restart-btn">Play Again</button>

          <p id="log">Battle started...</p>

          <button id="btn-north">Go up</button>
          <button id="btn-south">Go down</button>
          <button id="btn-west">Go left</button>
          <button id="btn-east">Go right</button>
        </div>
      </div>

      <script type="module" src="script.js"></script>
    </div>
  </body>
</html>
